<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sadguru Cafe - Online Menu & Delivery</title>
  <style>
    :root {
      --maroon: #5a1212;
      --maroon-dark: #3e0a0a;
      --gold: #d4af37;
      --bg-cream: #fdf8f4;
      --card-bg: #ffffff;
      --text-dark: #222222;
      --text-muted: #666666;
      --price-red: #8b1e1e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      line-height: 1.5;
      padding-bottom: 90px;
      position: relative;
    }

    /* Background Watermark Logo */
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60vw;
      height: 60vw;
      background-image: url('logo.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.08;
      z-index: -1;
      pointer-events: none;
    }

    /* Hero Section */
    .hero-section {
      background: linear-gradient(rgba(62, 10, 10, 0.85), rgba(90, 18, 18, 0.85)), url('cover-bg.jpg');
      background-size: cover;
      background-position: center;
      color: #fff;
      text-align: center;
      padding: 40px 16px;
      border-bottom: 4px solid var(--gold);
    }

    .hero-sub {
      color: var(--gold);
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    .cafe-logo-container {
      width: 130px;
      height: 130px;
      margin: 0 auto 15px;
      border: 3px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .cafe-logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-section h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 10px;
    }

    .wait-notice {
      display: inline-block;
      background-color: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--gold);
      border-radius: 25px;
      padding: 8px 18px;
      font-size: 0.9rem;
      color: #f7e7b4;
      margin-top: 10px;
    }

    .veg-badge {
      display: inline-block;
      border: 2px solid #00aa00;
      padding: 2px 8px;
      background: #fff;
      margin-top: 12px;
      border-radius: 4px;
    }
    .veg-dot {
      width: 12px;
      height: 12px;
      background-color: #00aa00;
      border-radius: 50%;
      display: inline-block;
    }

    /* Sticky Navigation */
    .category-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #fff;
      border-bottom: 2px solid #eee;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .category-nav::-webkit-scrollbar {
      height: 4px;
    }
    .category-nav::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 4px;
    }

    .category-nav a {
      text-decoration: none;
      background-color: var(--bg-cream);
      color: var(--maroon);
      border: 1px solid var(--gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .category-nav a:hover {
      background-color: var(--maroon);
      color: #fff;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .menu-section {
      margin-top: 32px;
      scroll-margin-top: 65px;
    }

    .section-title {
      font-size: 1.55rem;
      color: var(--maroon);
      padding-bottom: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .section-title span.sub-label {
      font-size: 0.95rem;
      color: var(--price-red);
      font-weight: 600;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .menu-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      border: 1px solid #f0e6d8;
      transition: transform 0.2s;
    }

    @keyframes pulse-anim {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); background-color: #fcf1d4; }
      100% { transform: scale(1); }
    }
    .pulse {
      animation: pulse-anim 0.3s ease;
    }

    .item-info h3 {
      font-size: 1rem;
      color: var(--text-dark);
      font-weight: 700;
      margin-bottom: 3px;
    }

    .item-info p {
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .card-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .item-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--price-red);
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      gap: 5px;
    }

    .add-btn {
      background-color: var(--maroon);
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .add-btn:hover {
      background-color: var(--gold);
      color: #1a1a1a;
    }

    .add-btn:active {
      transform: scale(0.92);
    }

    /* Extra Note Banner */
    .extra-note {
      text-align: center;
      background: #fdf2e9;
      border: 1px dashed var(--gold);
      padding: 12px;
      border-radius: 8px;
      margin: 40px 0 10px;
      color: var(--maroon);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Floating Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--maroon-dark);
      color: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      border-top: 3px solid var(--gold);
    }

    .cart-info {
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .cart-actions {
      display: flex;
      gap: 10px;
    }

    .view-cart-btn {
      background-color: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .cart-btn {
      background-color: #25D366 !important;
      color: #ffffff !important;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }

    .cart-btn:hover {
      background-color: #1ebe5d !important;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 16px;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 450px;
      border-radius: 12px;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
